name: Deploy to Aliyun ECS

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy
        required: false
        default: ""

concurrency:
  group: deploy-aliyun
  cancel-in-progress: false

permissions:
  contents: read

env:
  LAYER: deploy/layers/qmcn
  REMOTE_DIR: /opt/qm
  SANDBOX_IMAGE: qm-sandbox-local:latest

jobs:
  deploy:
    name: Build on host and bring up
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version

      - name: Vendor the pi coding agent
        run: bash "$LAYER/scripts/vendor-pi.sh"

      - name: Install dependencies
        run: npm ci

      - name: Render docker-compose.yml
        id: render
        env:
          QM_PUBLIC_URL: ${{ vars.QM_PUBLIC_URL }}
          QM_AUTH_EMAIL_DOMAIN: ${{ vars.QM_AUTH_EMAIL_DOMAIN }}
        run: |
          set -euo pipefail
          test -n "$QM_PUBLIC_URL" || { echo "::error::repository variable QM_PUBLIC_URL is not set"; exit 1; }
          test -n "$QM_AUTH_EMAIL_DOMAIN" || { echo "::error::repository variable QM_AUTH_EMAIL_DOMAIN is not set"; exit 1; }
          node "$LAYER/scripts/render-compose.ts" | tee /tmp/render.out
          grep '^CORE_HOST_PORT=' /tmp/render.out >> "$GITHUB_OUTPUT"

      - name: Show the rendered compose and secret map
        run: |
          set -euo pipefail
          cat "$LAYER/docker-compose.yml"
          echo "--- secret map (env name, source secret, requirement) ---"
          cat "$LAYER/.generated/secret-map"

      - name: Compute the sandbox image fingerprint
        id: fingerprint
        run: |
          set -euo pipefail
          fp="$(node --input-type=module -e '
            const { computeSandboxImageFingerprint } = await import("./src/sandbox/local-sandbox.ts");
            const fp = await computeSandboxImageFingerprint(process.cwd());
            if (!fp) { console.error("cannot compute sandbox image fingerprint"); process.exit(1); }
            console.log(fp);
          ')"
          echo "value=$fp" >> "$GITHUB_OUTPUT"

      - name: Write the deployment .env
        env:
          CORE_SIGNING_SECRET: ${{ secrets.CORE_SIGNING_SECRET }}
          CAPABILITY_SECRET: ${{ secrets.CAPABILITY_SECRET }}
          PORTAL_IDENTITY_SECRET: ${{ secrets.PORTAL_IDENTITY_SECRET }}
          CONNECTOR_SECRET_KEY: ${{ secrets.CONNECTOR_SECRET_KEY }}
          SKILL_SIGNING_SECRET: ${{ secrets.SKILL_SIGNING_SECRET }}
          PORTAL_SESSION_SECRET: ${{ secrets.PORTAL_SESSION_SECRET }}
          AUTH_TOKEN_SECRET: ${{ secrets.AUTH_TOKEN_SECRET }}
          AUTH_CLIENT_SECRET: ${{ secrets.AUTH_CLIENT_SECRET }}
          AUTH_SIGNING_JWK: ${{ secrets.AUTH_SIGNING_JWK }}
          AUTH_EMAIL_FROM: ${{ secrets.AUTH_EMAIL_FROM }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          PUBLIC_API_URL: ${{ secrets.PUBLIC_API_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          umask 077
          : > "$LAYER/.env"
          missing=()
          weak=()
          malformed=()
          strong=" CORE_SIGNING_SECRET CAPABILITY_SECRET PORTAL_IDENTITY_SECRET CONNECTOR_SECRET_KEY SKILL_SIGNING_SECRET PORTAL_SESSION_SECRET AUTH_TOKEN_SECRET AUTH_CLIENT_SECRET "
          while IFS=$'\t' read -r envname source requirement; do
            value="${!source:-}"
            if [[ -z "$value" ]]; then
              [[ "$requirement" == "required" ]] && missing+=("$source")
              continue
            fi
            if [[ "$value" == *$'\n'* || "$value" == *'$'* ]]; then
              malformed+=("$source")
              continue
            fi
            if [[ "$strong" == *" $source "* ]] && (( ${#value} < 32 )); then
              weak+=("$source")
              continue
            fi
            printf '%s=%s\n' "$envname" "$value" >> "$LAYER/.env"
          done < "$LAYER/.generated/secret-map"
          if (( ${#missing[@]} )); then
            echo "::error::missing required repository secrets: ${missing[*]}"
          fi
          if (( ${#weak[@]} )); then
            echo "::error::shorter than the 32 characters core requires: ${weak[*]}"
          fi
          if (( ${#malformed[@]} )); then
            echo "::error::these contain a newline or a '\$', which docker compose would corrupt: ${malformed[*]}"
          fi
          (( ${#missing[@]} + ${#weak[@]} + ${#malformed[@]} == 0 )) || exit 1
          printf 'LOCAL_SANDBOX_IMAGE=%s\n' "$SANDBOX_IMAGE" >> "$LAYER/.env"
          echo "wrote $(wc -l < "$LAYER/.env") entries"

      - name: Open the SSH channel
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          HOST: ${{ secrets.HOST }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_KEY" || { echo "::error::secret SSH_KEY is not set"; exit 1; }
          test -n "$HOST" || { echo "::error::secret HOST is not set"; exit 1; }
          if [[ -z "$SSH_KNOWN_HOSTS" ]]; then
            echo "::error::secret SSH_KNOWN_HOSTS is not set. All deployment secrets are copied to this host,"
            echo "::error::so its key must be pinned rather than trusted on first sight."
            echo "::error::Generate it once with: ssh-keyscan -H <host>"
            exit 1
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          cat > ~/.ssh/config <<'SSHCONFIG'
          Host deploy-target
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
            IdentityFile ~/.ssh/id_deploy
            IdentitiesOnly yes
          SSHCONFIG
          chmod 600 ~/.ssh/config

      - name: Ship the tree
        env:
          HOST: ${{ secrets.HOST }}
          USER_NAME: ${{ secrets.USER }}
        run: |
          set -euo pipefail
          tar --exclude=./.git --exclude=./node_modules --exclude='./**/node_modules' \
              --exclude="./$LAYER/.env" -czf /tmp/qm-tree.tgz .
          ssh -o Hostname="$HOST" -o User="$USER_NAME" deploy-target \
            "set -eu; rm -rf '$REMOTE_DIR.incoming'; mkdir -p '$REMOTE_DIR.incoming'"
          scp -o Hostname="$HOST" -o User="$USER_NAME" /tmp/qm-tree.tgz deploy-target:/tmp/qm-tree.tgz
          scp -o Hostname="$HOST" -o User="$USER_NAME" "$LAYER/.env" "deploy-target:$REMOTE_DIR.incoming.env"
          ssh -o Hostname="$HOST" -o User="$USER_NAME" deploy-target \
            "REMOTE_DIR='$REMOTE_DIR' LAYER='$LAYER' bash -s" <<'REMOTE'
          set -euo pipefail
          tar -xzf /tmp/qm-tree.tgz -C "$REMOTE_DIR.incoming"
          rm -f /tmp/qm-tree.tgz
          install -m 600 "$REMOTE_DIR.incoming.env" "$REMOTE_DIR.incoming/$LAYER/.env"
          rm -f "$REMOTE_DIR.incoming.env"
          rm -rf "$REMOTE_DIR.previous"
          if [ -d "$REMOTE_DIR" ]; then mv "$REMOTE_DIR" "$REMOTE_DIR.previous"; fi
          mv "$REMOTE_DIR.incoming" "$REMOTE_DIR"
          REMOTE

      - name: Build the agent sandbox image
        env:
          HOST: ${{ secrets.HOST }}
          USER_NAME: ${{ secrets.USER }}
          FINGERPRINT: ${{ steps.fingerprint.outputs.value }}
        run: |
          set -euo pipefail
          ssh -o Hostname="$HOST" -o User="$USER_NAME" deploy-target \
            "REMOTE_DIR='$REMOTE_DIR' FINGERPRINT='$FINGERPRINT' SANDBOX_IMAGE='$SANDBOX_IMAGE' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$REMOTE_DIR"
          docker build --platform linux/amd64 -f fly/Dockerfile -t qm-sandbox-base:dev .
          docker build --platform linux/amd64 -f local/Dockerfile \
            --build-arg BASE=qm-sandbox-base:dev \
            --label "qm.sandbox-fingerprint=$FINGERPRINT" \
            -t "$SANDBOX_IMAGE" .
          REMOTE

      - name: Build and bring up the control plane
        env:
          HOST: ${{ secrets.HOST }}
          USER_NAME: ${{ secrets.USER }}
        run: |
          set -euo pipefail
          ssh -o Hostname="$HOST" -o User="$USER_NAME" deploy-target \
            "LAYER_DIR='$REMOTE_DIR/$LAYER' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$LAYER_DIR"
          docker compose build
          docker compose up -d --remove-orphans
          docker compose ps
          REMOTE

      - name: Gate on every service, not just core
        env:
          HOST: ${{ secrets.HOST }}
          USER_NAME: ${{ secrets.USER }}
          CORE_HOST_PORT: ${{ steps.render.outputs.CORE_HOST_PORT }}
        run: |
          set -euo pipefail
          ssh -o Hostname="$HOST" -o User="$USER_NAME" deploy-target \
            "LAYER_DIR='$REMOTE_DIR/$LAYER' CORE_HOST_PORT='$CORE_HOST_PORT' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$LAYER_DIR"
          healthy=""
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 5 "http://127.0.0.1:$CORE_HOST_PORT/healthz" >/dev/null; then
              healthy=yes
              break
            fi
            sleep 4
          done
          if [ -z "$healthy" ]; then
            echo "core never answered /healthz on port $CORE_HOST_PORT" >&2
            docker compose logs --tail 80 core >&2
            exit 1
          fi
          echo "core healthy after $attempt attempt(s)"
          sleep 5
          stopped="$(docker compose ps --format '{{.Service}} {{.State}}' | awk '$2 != "running" {print $1}')"
          if [ -n "$stopped" ]; then
            echo "these services are not running: $stopped" >&2
            for svc in $stopped; do
              echo "--- $svc ---" >&2
              docker compose logs --tail 40 "$svc" >&2
            done
            exit 1
          fi
          docker compose ps
          REMOTE

      - name: Scrub the runner
        if: always()
        run: rm -f "$LAYER/.env" ~/.ssh/id_deploy /tmp/qm-tree.tgz
